<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0d">
  <title>My AI Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0d;
      color: #f5f5f7;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 28px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.04em; }
    .sub { color: #888892; font-size: 13px; margin-top: 6px; }
    a { color: #9bbcff; text-decoration: none; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .card { background: #15151a; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 18px; }
    .label { color: #8e8e98; font-size: 12px; }
    .value { font-size: 29px; font-weight: 700; margin-top: 8px; }
    .wide { margin-top: 12px; }
    .status { margin-top: 18px; color: #777781; font-size: 12px; }
    button { margin-top: 18px; padding: 9px 13px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: #1e1e24; color: #fff; cursor: pointer; }
    @media (max-width: 800px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 500px) { .grid { grid-template-columns: 1fr; } main { width: min(100% - 20px, 1100px); padding: 20px 0; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>My AI Admin</h1>
        <div class="sub">Private aggregate usage dashboard. No conversation text is shown here.</div>
      </div>
      <a href="/">Back to My AI</a>
    </header>

    <section class="grid" id="stats">
      <div class="card"><div class="label">Users</div><div class="value">—</div></div>
      <div class="card"><div class="label">Messages</div><div class="value">—</div></div>
      <div class="card"><div class="label">Conversations</div><div class="value">—</div></div>
      <div class="card"><div class="label">Memories</div><div class="value">—</div></div>
      <div class="card"><div class="label">Chats · 24h</div><div class="value">—</div></div>
      <div class="card"><div class="label">Chats · 7d</div><div class="value">—</div></div>
      <div class="card"><div class="label">Chats · 30d</div><div class="value">—</div></div>
      <div class="card"><div class="label">Active users · 7d</div><div class="value">—</div></div>
    </section>

    <div class="card wide">
      <div class="label">Status</div>
      <div class="status" id="status">Loading…</div>
      <button id="refresh">Refresh</button>
    </div>
  </main>

  <script>
    const cards = [...document.querySelectorAll("#stats .value")];
    const fields = ["users", "messages", "conversations", "memories", "chats24h", "chats7d", "chats30d", "activeUsers7d"];
    const status = document.getElementById("status");

    async function load() {
      status.textContent = "Loading…";
      try {
        const response = await fetch("/api/admin/stats", { cache: "no-store" });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Unable to load stats.");
        fields.forEach((field, index) => { cards[index].textContent = String(data[field] ?? 0); });
        status.textContent = `Updated ${new Date(data.generatedAt).toLocaleString()}`;
      } catch (error) {
        status.textContent = error.message;
      }
    }

    document.getElementById("refresh").addEventListener("click", load);
    load();
  </script>
</body>
</html>
