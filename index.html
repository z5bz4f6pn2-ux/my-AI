<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* ================================================
       HEADER
       ================================================ */

    header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      position: relative;
      z-index: 20;
      background: #111;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
    }

    .header-button {
      border: 1px solid #555;
      border-radius: 18px;
      padding: 8px 12px;
      background: #222;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .header-button:hover {
      background: #333;
    }


    /* ================================================
       MAIN LAYOUT
       ================================================ */

    #layout {
      height: calc(100vh - 60px);
      position: relative;
    }

    #main {
      width: 100%;
      height: 100%;
      position: relative;
    }


    /* ================================================
       SLIDE-OUT SIDEBAR
       ================================================ */

    #sidebar {
      position: fixed;
      top: 60px;
      left: 0;
      bottom: 0;

      width: 300px;

      padding: 15px;

      background: #151515;

      border-right: 1px solid #333;

      overflow-y: auto;

      z-index: 50;

      transform: translateX(-100%);

      transition: transform 0.2s ease;

      box-shadow: 10px 0 30px rgba(0,0,0,0.4);
    }

    #sidebar.open {
      transform: translateX(0);
    }


    .sidebar-title {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 12px;
      text-transform: uppercase;
    }


    /* ================================================
       SIDEBAR OVERLAY
       ================================================ */

    #sidebarOverlay {
      display: none;

      position: fixed;

      top: 60px;
      left: 0;
      right: 0;
      bottom: 0;

      background: rgba(0,0,0,0.45);

      z-index: 40;
    }

    #sidebarOverlay.show {
      display: block;
    }


    /* ================================================
       CHAT ITEMS
       ================================================ */

    .chat-item {
      display: flex;

      align-items: center;

      gap: 6px;

      padding: 8px;

      margin-bottom: 7px;

      border-radius: 10px;

      background: #222;

      cursor: pointer;

      overflow: hidden;
    }

    .chat-item:hover {
      background: #333;
    }

    .chat-item.active {
      background: #2675ff;
    }


    .chat-title {
      flex: 1;

      min-width: 0;

      padding: 5px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .chat-action {
      flex-shrink: 0;

      border: none;

      border-radius: 8px;

      padding: 6px 7px;

      background: transparent;

      color: #aaa;

      cursor: pointer;

      font-size: 13px;
    }

    .chat-action:hover {
      background: rgba(255,255,255,0.12);

      color: white;
    }


    .delete-chat:hover {
      background: #662222;

      color: #ffb0b0;
    }


    /* ================================================
       CHAT AREA
       ================================================ */

    #chat {
      padding: 15px;

      height: calc(100vh - 150px);

      overflow-y: auto;
    }


    .message {
      padding: 12px;

      margin: 10px 0;

      border-radius: 15px;

      max-width: 80%;

      white-space: pre-wrap;

      word-wrap: break-word;
    }


    .user {
      background: #2675ff;

      margin-left: auto;
    }


    .ai {
      background: #333;
    }


    /* ================================================
       INPUT
       ================================================ */

    .input-area {
      position: absolute;

      bottom: 0;

      left: 0;

      right: 0;

      padding: 10px;

      background: #111;

      display: flex;

      gap: 8px;
    }


    input {
      flex: 1;

      padding: 12px;

      border-radius: 20px;

      border: 1px solid #555;

      background: #222;

      color: white;

      font-size: 16px;

      outline: none;
    }


    input:focus {
      border-color: #2675ff;
    }


    button {
      border: none;

      border-radius: 20px;

      padding: 12px 16px;

      font-weight: bold;

      cursor: pointer;
    }


    .send-button {
      background: white;

      color: black;
    }


    /* ================================================
       MEMORY PANEL
       ================================================ */

    #memoryPanel {
      display: none;

      position: fixed;

      top: 60px;

      right: 20px;

      width: 350px;

      max-height: 70vh;

      overflow-y: auto;

      background: #1b1b1b;

      border: 1px solid #444;

      border-radius: 15px;

      padding: 18px;

      z-index: 100;

      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }


    #memoryPanel h2 {
      margin-top: 0;

      margin-bottom: 5px;
    }


    .memory-description {
      color: #999;

      font-size: 13px;

      margin-bottom: 15px;
    }


    .memory-item {
      background: #252525;

      border-radius: 10px;

      padding: 12px;

      margin-bottom: 10px;
    }


    .memory-text {
      margin-bottom: 10px;

      line-height: 1.4;
    }


    .delete-memory {
      background: #442222;

      color: #ffb0b0;

      padding: 7px 11px;

      border-radius: 15px;

      font-size: 12px;
    }


    .delete-memory:hover {
      background: #662222;
    }


    .close-memory {
      background: #333;

      color: white;

      float: right;

      padding: 6px 10px;
    }


    .no-memories {
      color: #888;

      padding: 10px 0;
    }


    /* ================================================
       MOBILE
       ================================================ */

    @media (max-width: 700px) {

      #sidebar {
        width: 280px;
      }

      #memoryPanel {
        left: 10px;

        right: 10px;

        width: auto;
      }

      .message {
        max-width: 90%;
      }

      .title {
        font-size: 20px;
      }

      .header-button {
        padding: 8px 10px;
      }

    }

  </style>
</head>


<body>


<header>

  <div class="title">
    My AI
  </div>


  <div class="header-buttons">

    <button
      class="header-button"
      onclick="toggleSidebar()"
    >
      ☰ Chats
    </button>


    <button
      class="header-button"
      onclick="toggleMemoryPanel()"
    >
      🧠 Memory
    </button>


    <button
      class="header-button"
      onclick="newChat()"
    >
      + New Chat
    </button>

  </div>

</header>


<div id="layout">


  <!-- SIDEBAR -->

  <aside id="sidebar">

    <div class="sidebar-title">
      Recent Chats
    </div>

    <div id="conversationList">
      Loading...
    </div>

  </aside>


  <!-- SIDEBAR OVERLAY -->

  <div
    id="sidebarOverlay"
    onclick="closeSidebar()"
  ></div>


  <!-- MAIN CHAT -->

  <main id="main">

    <div id="chat">

      <div class="message ai">
        Hello 👋🏻 I'm your AI assistant.
        We're building me together.
      </div>

    </div>


    <div class="input-area">

      <input
        id="message"
        placeholder="Talk to me..."
        autocomplete="off"
      >


      <button
        class="send-button"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>

  </main>

</div>


<!-- MEMORY PANEL -->

<div id="memoryPanel">

  <button
    class="close-memory"
    onclick="toggleMemoryPanel()"
  >
    ✕
  </button>


  <h2>
    My Memories
  </h2>


  <div class="memory-description">
    These are the things My AI has permanently remembered.
  </div>


  <div id="memoryList">
    Loading...
  </div>

</div>


<script>


let conversationHistory = [];

let conversationId = null;


/* ==================================================
   SIDEBAR
   ================================================== */

function toggleSidebar() {

  const sidebar =
    document.getElementById(
      "sidebar"
    );

  const overlay =
    document.getElementById(
      "sidebarOverlay"
    );


  const isOpen =
    sidebar.classList.contains(
      "open"
    );


  if (isOpen) {

    closeSidebar();

  } else {

    sidebar.classList.add(
      "open"
    );

    overlay.classList.add(
      "show"
    );

    loadConversations();

  }

}


function closeSidebar() {

  document
    .getElementById(
      "sidebar"
    )
    .classList.remove(
      "open"
    );


  document
    .getElementById(
      "sidebarOverlay"
    )
    .classList.remove(
      "show"
    );

}


/* ==================================================
   LOAD CONVERSATIONS
   ================================================== */

async function loadConversations() {

  const list =
    document.getElementById(
      "conversationList"
    );


  try {

    const response =
      await fetch(
        "/api/conversations"
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to load conversations"
      );

    }


    list.innerHTML = "";


    if (
      !data.conversations ||
      data.conversations.length === 0
    ) {

      list.innerHTML =
        "<div style='color:#777;'>No saved chats yet.</div>";

      return;

    }


    data.conversations.forEach(
      conversation => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "chat-item";


        if (
          String(conversation.id) ===
          String(conversationId)
        ) {

          item.classList.add(
            "active"
          );

        }


        const title =
          document.createElement(
            "div"
          );


        title.className =
          "chat-title";


        title.textContent =
          conversation.title ||
          "New Chat";


        title.onclick =
          () =>
            loadConversation(
              conversation.id
            );


        /* RENAME */

        const renameButton =
          document.createElement(
            "button"
          );


        renameButton.className =
          "chat-action";


        renameButton.textContent =
          "✏️";


        renameButton.title =
          "Rename";


        renameButton.onclick =
          event => {

            event.stopPropagation();

            renameConversation(
              conversation.id,
              conversation.title ||
              "New Chat"
            );

          };


        /* DELETE */

        const deleteButton =
          document.createElement(
            "button"
          );


        deleteButton.className =
          "chat-action delete-chat";


        deleteButton.textContent =
          "🗑️";


        deleteButton.title =
          "Delete";


        deleteButton.onclick =
          event => {

            event.stopPropagation();

            deleteConversation(
              conversation.id
            );

          };


        item.appendChild(
          title
        );


        item.appendChild(
          renameButton
        );


        item.appendChild(
          deleteButton
        );


        list.appendChild(
          item
        );

      }
    );


  } catch (error) {

    list.innerHTML =
      "<div style='color:#f66;'>Unable to load chats.</div>";

    console.error(error);

  }

}


/* ==================================================
   LOAD ONE CONVERSATION
   ================================================== */

async function loadConversation(id) {

  try {

    const response =
      await fetch(
        "/api/conversations/" +
        id
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to load conversation"
      );

    }


    conversationId =
      data.conversation.id;


    conversationHistory = [];


    const chat =
      document.getElementById(
        "chat"
      );


    chat.innerHTML = "";


    data.messages.forEach(
      message => {

        const messageElement =
          document.createElement(
            "div"
          );


        messageElement.className =
          "message " +
          (
            message.role === "user"
              ? "user"
              : "ai"
          );


        messageElement.textContent =
          message.content;


        chat.appendChild(
          messageElement
        );


        conversationHistory.push({

          role:
            message.role,

          content:
            message.content

        });

      }
    );


    chat.scrollTop =
      chat.scrollHeight;


    loadConversations();


    closeSidebar();


    document
      .getElementById(
        "message"
      )
      .focus();


  } catch (error) {

    console.error(error);

    alert(
      "Couldn't load this conversation."
    );

  }

}


/* ==================================================
   RENAME CONVERSATION
   ================================================== */

async function renameConversation(
  id,
  currentTitle
) {

  const newTitle =
    prompt(
      "Rename conversation:",
      currentTitle
    );


  if (
    newTitle === null
  ) {
    return;
  }


  const title =
    newTitle.trim();


  if (!title) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/conversations/" +
        id,
        {

          method:
            "PATCH",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              title
            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to rename conversation"
      );

    }


    await loadConversations();


  } catch (error) {

    alert(
      "Couldn't rename chat: " +
      error.message
    );

  }

}


/* ==================================================
   DELETE CONVERSATION
   ================================================== */

async function deleteConversation(id) {

  try {

    const response =
      await fetch(
        "/api/conversations/" +
        id,
        {
          method:
            "DELETE"
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to delete conversation"
      );

    }


    /* If the deleted chat was open,
       start a fresh chat */

    if (
      String(conversationId) ===
      String(id)
    ) {

      conversationHistory = [];

      conversationId = null;


      document.getElementById(
        "chat"
      ).innerHTML = `

        <div class="message ai">

          Hello 👋🏻 I'm your AI assistant.
          This is a new conversation.

        </div>

      `;

    }


    await loadConversations();


  } catch (error) {

    alert(
      "Couldn't delete chat: " +
      error.message
    );

  }

}


/* ==================================================
   SEND MESSAGE
   ================================================== */

async function sendMessage() {

  const input =
    document.getElementById(
      "message"
    );


  const chat =
    document.getElementById(
      "chat"
    );


  const message =
    input.value.trim();


  if (
    message === ""
  ) {
    return;
  }


  const userMessage =
    document.createElement(
      "div"
    );


  userMessage.className =
    "message user";


  userMessage.textContent =
    message;


  chat.appendChild(
    userMessage
  );


  input.value = "";


  conversationHistory.push({

    role:
      "user",

    content:
      message

  });


  const aiMessage =
    document.createElement(
      "div"
    );


  aiMessage.className =
    "message ai";


  aiMessage.textContent =
    "Thinking...";


  chat.appendChild(
    aiMessage
  );


  chat.scrollTop =
    chat.scrollHeight;


  try {

    const response =
      await fetch(
        "/api/chat",
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                message,

              history:
                conversationHistory.slice(
                  0,
                  -1
                ),

              conversationId:
                conversationId

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Something went wrong"
      );

    }


    if (
      data.conversationId
    ) {

      conversationId =
        data.conversationId;

    }


    const reply =
      data.response ||
      "I couldn't generate a response.";


    aiMessage.textContent =
      reply;


    conversationHistory.push({

      role:
        "assistant",

      content:
        reply

    });


    loadConversations();


  } catch (error) {

    aiMessage.textContent =
      "Sorry, something went wrong: " +
      error.message;


    conversationHistory.pop();

  }


  chat.scrollTop =
    chat.scrollHeight;


  input.focus();

}


/* ==================================================
   NEW CHAT
   ================================================== */

function newChat() {

  conversationHistory = [];

  conversationId = null;


  const chat =
    document.getElementById(
      "chat"
    );


  chat.innerHTML = `

    <div class="message ai">

      Hello 👋🏻 I'm your AI assistant.
      This is a new conversation.

    </div>

  `;


  loadConversations();


  closeSidebar();


  document
    .getElementById(
      "message"
    )
    .focus();

}


/* ==================================================
   LOAD MEMORIES
   ================================================== */

async function loadMemories() {

  const list =
    document.getElementById(
      "memoryList"
    );


  list.innerHTML =
    "Loading...";


  try {

    const response =
      await fetch(
        "/api/memories"
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to load memories"
      );

    }


    list.innerHTML = "";


    if (
      !data.memories ||
      data.memories.length === 0
    ) {

      list.innerHTML =
        `<div class="no-memories">
          My AI hasn't permanently remembered anything yet.
        </div>`;

      return;

    }


    data.memories.forEach(
      memory => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "memory-item";


        const text =
          document.createElement(
            "div"
          );


        text.className =
          "memory-text";


        text.textContent =
          memory.memory;


        const deleteButton =
          document.createElement(
            "button"
          );


        deleteButton.className =
          "delete-memory";


        deleteButton.textContent =
          "Delete";


        deleteButton.onclick =
          () =>
            deleteMemory(
              memory.id
            );


        item.appendChild(
          text
        );


        item.appendChild(
          deleteButton
        );


        list.appendChild(
          item
        );

      }
    );


  } catch (error) {

    list.innerHTML =
      `<div style="color:#f66;">
        Unable to load memories.
      </div>`;

    console.error(error);

  }

}


/* ==================================================
   DELETE MEMORY
   ================================================== */

async function deleteMemory(id) {

  const confirmed =
    confirm(
      "Are you sure you want My AI to forget this?"
    );


  if (!confirmed) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/memories/" +
        id,
        {
          method:
            "DELETE"
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to delete memory"
      );

    }


    await loadMemories();


  } catch (error) {

    alert(
      "Couldn't delete memory: " +
      error.message
    );

  }

}


/* ==================================================
   MEMORY PANEL
   ================================================== */

function toggleMemoryPanel() {

  const panel =
    document.getElementById(
      "memoryPanel"
    );


  if (
    panel.style.display ===
    "block"
  ) {

    panel.style.display =
      "none";

  } else {

    panel.style.display =
      "block";

    loadMemories();

  }

}


/* ==================================================
   ENTER KEY
   ================================================== */

const messageInput =
  document.getElementById(
    "message"
  );


messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* ==================================================
   START
   ================================================== */

loadConversations();

messageInput.focus();

</script>

</body>
</html>
