<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
    }

    #newChatButton {
      border: 1px solid #555;
      border-radius: 18px;
      padding: 8px 12px;
      background: #222;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #newChatButton:hover {
      background: #333;
    }

    #chat {
      padding: 15px;
      height: 70vh;
      overflow-y: auto;
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 15px;
      max-width: 80%;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #2675ff;
      margin-left: auto;
    }

    .ai {
      background: #333;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px;
      background: #111;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid #555;
      background: #222;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2675ff;
    }

    button {
      border: none;
      border-radius: 20px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .send-button {
      background: white;
      color: black;
    }
  </style>
</head>

<body>

<header>

  <div class="title">My AI</div>

  <button
    id="newChatButton"
    onclick="newChat()"
  >
    + New Chat
  </button>

</header>

<div id="chat">

  <div class="message ai">
    Hello 👋 I'm your AI assistant. We're building me together.
  </div>

</div>

<div class="input-area">

  <input
    id="message"
    placeholder="Talk to me..."
    autocomplete="off"
  >

  <button
    class="send-button"
    onclick="sendMessage()"
  >
    Send
  </button>

</div>

<script>

let conversationHistory = [];

let conversationId = null;


// --------------------------------------------------
// SEND MESSAGE
// --------------------------------------------------

async function sendMessage() {

  const input =
    document.getElementById("message");

  const chat =
    document.getElementById("chat");

  const message =
    input.value.trim();

  if (message === "") return;


  // Display user message
  const userMessage =
    document.createElement("div");

  userMessage.className =
    "message user";

  userMessage.textContent =
    message;

  chat.appendChild(userMessage);


  // Clear input
  input.value = "";


  // Add to local history
  conversationHistory.push({
    role: "user",
    content: message
  });


  // Create thinking message
  const aiMessage =
    document.createElement("div");

  aiMessage.className =
    "message ai";

  aiMessage.textContent =
    "Thinking...";

  chat.appendChild(aiMessage);

  chat.scrollTop =
    chat.scrollHeight;


  try {

    const response =
      await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          message: message,

          history:
            conversationHistory.slice(0, -1),

          conversationId:
            conversationId

        })

      });


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Something went wrong"
      );

    }


    // Store conversation ID
    if (data.conversationId) {

      conversationId =
        data.conversationId;

    }


    const reply =
      data.response ||
      "I couldn't generate a response.";


    // Display AI response
    aiMessage.textContent =
      reply;


    // Save AI response locally
    conversationHistory.push({

      role: "assistant",

      content: reply

    });


  } catch (error) {

    aiMessage.textContent =
      "Sorry, something went wrong: " +
      error.message;


    // Remove failed user message
    conversationHistory.pop();

  }


  chat.scrollTop =
    chat.scrollHeight;


  // Focus input
  input.focus();

}


// --------------------------------------------------
// NEW CHAT
// --------------------------------------------------

function newChat() {

  conversationHistory = [];

  conversationId = null;


  const chat =
    document.getElementById("chat");


  chat.innerHTML = `

    <div class="message ai">

      Hello 👋 I'm your AI assistant.
      This is a new conversation.

    </div>

  `;


  document
    .getElementById("message")
    .focus();

}


// --------------------------------------------------
// ENTER KEY
// --------------------------------------------------

const messageInput =
  document.getElementById("message");


messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


// Automatically focus input
messageInput.focus();

</script>

</body>
</html>
