<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
    }

    #newChatButton {
      border: 1px solid #555;
      border-radius: 18px;
      padding: 8px 12px;
      background: #222;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #newChatButton:hover {
      background: #333;
    }

    #layout {
      display: flex;
      height: calc(100vh - 60px);
    }

    #sidebar {
      width: 250px;
      border-right: 1px solid #333;
      padding: 15px;
      overflow-y: auto;
      background: #151515;
    }

    .sidebar-title {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .chat-item {
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 10px;
      background: #222;
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .chat-item:hover {
      background: #333;
    }

    .chat-item.active {
      background: #2675ff;
    }

    #main {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    #chat {
      padding: 15px;
      height: calc(100vh - 150px);
      overflow-y: auto;
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 15px;
      max-width: 80%;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #2675ff;
      margin-left: auto;
    }

    .ai {
      background: #333;
    }

    .input-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px;
      background: #111;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid #555;
      background: #222;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2675ff;
    }

    button {
      border: none;
      border-radius: 20px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .send-button {
      background: white;
      color: black;
    }

    @media (max-width: 700px) {

      #sidebar {
        width: 190px;
      }

      .message {
        max-width: 90%;
      }

      .title {
        font-size: 20px;
      }

    }
  </style>
</head>

<body>

<header>

  <div class="title">
    My AI
  </div>

  <button
    id="newChatButton"
    onclick="newChat()"
  >
    + New Chat
  </button>

</header>


<div id="layout">


  <!-- SIDEBAR -->

  <aside id="sidebar">

    <div class="sidebar-title">
      Recent Chats
    </div>

    <div id="conversationList">
      Loading...
    </div>

  </aside>


  <!-- MAIN CHAT -->

  <main id="main">

    <div id="chat">

      <div class="message ai">
        Hello 👋 I'm your AI assistant.
        We're building me together.
      </div>

    </div>


    <div class="input-area">

      <input
        id="message"
        placeholder="Talk to me..."
        autocomplete="off"
      >

      <button
        class="send-button"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>

  </main>

</div>


<script>

let conversationHistory = [];

let conversationId = null;


// --------------------------------------------------
// LOAD CONVERSATIONS
// --------------------------------------------------

async function loadConversations() {

  const list =
    document.getElementById(
      "conversationList"
    );

  try {

    const response =
      await fetch(
        "/api/conversations"
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Unable to load conversations"
      );
    }


    list.innerHTML = "";


    if (
      !data.conversations ||
      data.conversations.length === 0
    ) {

      list.innerHTML =
        "<div style='color:#777;'>No saved chats yet.</div>";

      return;
    }


    data.conversations.forEach(
      conversation => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "chat-item";


        if (
          String(conversation.id) ===
          String(conversationId)
        ) {

          item.classList.add(
            "active"
          );

        }


        item.textContent =
          conversation.title ||
          "New Chat";


        item.onclick = () =>
          loadConversation(
            conversation.id
          );


        list.appendChild(item);

      }
    );


  } catch (error) {

    list.innerHTML =
      "<div style='color:#f66;'>Unable to load chats.</div>";

    console.error(error);

  }

}


// --------------------------------------------------
// LOAD ONE CONVERSATION
// --------------------------------------------------

async function loadConversation(id) {

  try {

    const response =
      await fetch(
        "/api/conversations/" +
        id
      );

    const data =
      await response.json();


    if (!response.ok) {
      throw new Error(
        data.error ||
        "Unable to load conversation"
      );
    }


    conversationId =
      data.conversation.id;


    conversationHistory = [];


    const chat =
      document.getElementById(
        "chat"
      );

    chat.innerHTML = "";


    data.messages.forEach(
      message => {

        const messageElement =
          document.createElement(
            "div"
          );


        messageElement.className =
          "message " +
          (
            message.role === "user"
              ? "user"
              : "ai"
          );


        messageElement.textContent =
          message.content;


        chat.appendChild(
          messageElement
        );


        conversationHistory.push({

          role:
            message.role,

          content:
            message.content

        });

      }
    );


    chat.scrollTop =
      chat.scrollHeight;


    loadConversations();


    document
      .getElementById("message")
      .focus();


  } catch (error) {

    console.error(error);

    alert(
      "Couldn't load this conversation."
    );

  }

}


// --------------------------------------------------
// SEND MESSAGE
// --------------------------------------------------

async function sendMessage() {

  const input =
    document.getElementById(
      "message"
    );

  const chat =
    document.getElementById(
      "chat"
    );

  const message =
    input.value.trim();


  if (message === "") {
    return;
  }


  // Show user message

  const userMessage =
    document.createElement(
      "div"
    );

  userMessage.className =
    "message user";

  userMessage.textContent =
    message;

  chat.appendChild(
    userMessage
  );


  input.value = "";


  conversationHistory.push({

    role: "user",

    content: message

  });


  // Thinking message

  const aiMessage =
    document.createElement(
      "div"
    );

  aiMessage.className =
    "message ai";

  aiMessage.textContent =
    "Thinking...";

  chat.appendChild(
    aiMessage
  );


  chat.scrollTop =
    chat.scrollHeight;


  try {

    const response =
      await fetch(
        "/api/chat",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                message,

              history:
                conversationHistory.slice(
                  0,
                  -1
                ),

              conversationId:
                conversationId

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Something went wrong"
      );

    }


    // Store conversation ID

    if (
      data.conversationId
    ) {

      conversationId =
        data.conversationId;

    }


    const reply =
      data.response ||
      "I couldn't generate a response.";


    aiMessage.textContent =
      reply;


    conversationHistory.push({

      role:
        "assistant",

      content:
        reply

    });


    // Refresh sidebar

    loadConversations();


  } catch (error) {

    aiMessage.textContent =
      "Sorry, something went wrong: " +
      error.message;


    conversationHistory.pop();

  }


  chat.scrollTop =
    chat.scrollHeight;


  input.focus();

}


// --------------------------------------------------
// NEW CHAT
// --------------------------------------------------

function newChat() {

  conversationHistory = [];

  conversationId = null;


  const chat =
    document.getElementById(
      "chat"
    );


  chat.innerHTML = `

    <div class="message ai">

      Hello 👋 I'm your AI assistant.
      This is a new conversation.

    </div>

  `;


  loadConversations();


  document
    .getElementById("message")
    .focus();

}


// --------------------------------------------------
// ENTER KEY
// --------------------------------------------------

const messageInput =
  document.getElementById(
    "message"
  );


messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


// --------------------------------------------------
// START
// --------------------------------------------------

loadConversations();

messageInput.focus();

</script>

</body>
</html>
