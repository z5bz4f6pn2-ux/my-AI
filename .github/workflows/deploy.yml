name: Deploy My AI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: my-ai-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate Worker source
        run: node --check worker.js

      - name: Validate Wrangler configuration
        run: npx --yes wrangler@4.123.0 check

      - name: Deploy Worker
        run: npx --yes wrangler@4.123.0 deploy

